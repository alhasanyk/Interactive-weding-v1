<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Wedding Invitation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Pinyon+Script&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f7f4ef;
      font-family: 'Cinzel', serif;
    }

    .screen-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f7f4ef;
      overflow: hidden;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }

    .screen-container.active {
      opacity: 1;
      pointer-events: auto;
    }

    .screen-container img, .screen-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      position: absolute;
    }

    #envelope-wrapper {
      z-index: 99;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #000;
    }

    /* زر البداية الفخم (Press) */
    #playBtn {
      position: absolute;
      z-index: 9999;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: white;
      font-size: 18px;
      font-family: 'Cinzel', serif;
      letter-spacing: 3px;
      text-transform: uppercase;
      padding: 14px 32px;
      border-radius: 40px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      transition: opacity 0.4s ease, transform 0.2s ease;
    }

    #playBtn:active {
      transform: scale(0.95);
    }

    .envelope-box {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    #couple-names {
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
      width: 100%;
    }

    /* تأثير الخروج الفخم للأسماء */
    .name-top, .name-bottom, .name-and {
      font-family: 'Pinyon Script', cursive;
      color: #3b2a22;
      opacity: 0;
      transform: scale(0.6);
      filter: blur(8px);
      transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1), 
                  transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), 
                  filter 1.2s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .name-top {
      font-size: 2.8rem;
      line-height: 1.1;
    }

    .name-and {
      font-size: 2rem;
      color: #7a6558;
      margin: 6px 0;
      letter-spacing: 2px;
    }

    .name-bottom {
      font-size: 2.8rem;
      line-height: 1.1;
    }

    .name-top.show, .name-and.show, .name-bottom.show {
      opacity: 1;
      transform: scale(1);
      filter: blur(0px);
    }

    #final-container {
      z-index: 10;
    }

    .action-group {
      position: absolute;
      bottom: calc(96px + env(safe-area-inset-bottom, 0px));
      z-index: 5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .location-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #332211;
      text-decoration: none;
      font-family: 'Cinzel', serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 6px 14px;
      border-radius: 20px;
      background: transparent;
      border: 1px solid rgba(51, 34, 17, 0.3);
      backdrop-filter: blur(2px);
      transition: all 0.3s ease;
    }

    .location-btn svg {
      width: 14px;
      height: 14px;
      fill: #332211;
    }

    .calendar-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: transparent;
      color: #221100;
      padding: 6px 14px;
      border-radius: 20px;
      font-family: 'Cinzel', serif;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.3s ease;
      border: 1px solid rgba(34, 17, 0, 0.3);
    }

    .calendar-btn svg {
      width: 12px;
      height: 12px;
      fill: #221100;
    }

    .countdown-box {
      position: absolute;
      bottom: calc(48px + env(safe-area-inset-bottom, 0px));
      z-index: 2;
      background: transparent;
      border-radius: 10px;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 210px;
    }

    .time-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 38px;
    }

    .time-unit .number {
      font-family: 'Cinzel', serif;
      font-size: 1rem;
      font-weight: 700;
      color: #3b2a22;
      line-height: 1;
    }

    .time-unit .label {
      font-family: 'Cinzel', serif;
      font-size: 0.48rem;
      font-weight: 600;
      color: #554433;
      letter-spacing: 0.5px;
      margin-top: 2px;
    }

    .colon {
      font-size: 0.9rem;
      font-weight: bold;
      color: #3b2a22;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>

  <!-- 1. شاشة الظرف والفيديو مع زر Press -->
  <div id="envelope-wrapper" class="screen-container active">
    <button id="playBtn">PRESS</button>
    <div class="envelope-box">
      <video id="envelope-video" src="https://files.catbox.moe/qknz0f.mp4" muted playsinline webkit-playsinline preload="auto"></video>
    </div>
  </div>

  <!-- 2. شاشة الخلفية والأسماء -->
  <div id="main-background" class="screen-container">
    <img src="https://files.catbox.moe/mndbwr.jpeg" alt="Background">
    <div id="couple-names">
      <div class="name-top" id="n1">Niggin Midi</div>
      <div class="name-and" id="n2">and</div>
      <div class="name-bottom" id="n3">Niger Hasooni</div>
    </div>
  </div>

  <!-- 3. الشاشة الأخيرة -->
  <div id="final-container" class="screen-container">
    <img src="https://files.catbox.moe/3e9448.jpeg" alt="Final Image">

    <div class="action-group">
      <a href="https://maps.app.goo.gl/6wWBru4JgbSsMHRZ7?g_st=ic" target="_blank" class="location-btn">
        <svg viewBox="0 0 24 24">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
        </svg>
        LOCATION
      </a>

      <button class="calendar-btn" onclick="addToCalendar()">
        <svg viewBox="0 0 24 24">
          <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.11 0-1.99.9-1.99 2L3 20c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2zm-7 5h5v5h-5z"/>
        </svg>
        ADD TO CALENDAR
      </button>
    </div>

    <div class="countdown-box">
      <div class="time-unit">
        <span class="number" id="days">00</span>
        <span class="label">DAYS</span>
      </div>
      <span class="colon">:</span>
      <div class="time-unit">
        <span class="number" id="hours">00</span>
        <span class="label">HRS</span>
      </div>
      <span class="colon">:</span>
      <div class="time-unit">
        <span class="number" id="minutes">00</span>
        <span class="label">MIN</span>
      </div>
      <span class="colon">:</span>
      <div class="time-unit">
        <span class="number" id="seconds">00</span>
        <span class="label">SEC</span>
      </div>
    </div>
  </div>

  <script>
    const eventDate = new Date("2026-09-25T05:00:00").getTime();

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = eventDate - now;

      if (difference > 0) {
        const d = Math.floor(difference / (1000 * 60 * 60 * 24));
        const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
        const s = Math.floor((difference % (1000 * 60)) / 1000);

        document.getElementById("days").innerText = d < 10 ? "0" + d : d;
        document.getElementById("hours").innerText = h < 10 ? "0" + h : h;
        document.getElementById("minutes").innerText = m < 10 ? "0" + m : m;
        document.getElementById("seconds").innerText = s < 10 ? "0" + s : s;
      }
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();

    function addToCalendar() {
      const title = "Wedding Celebration - Niggin & Niger";
      const location = "Makkah";
      const description = "We are honored to have you join our special day!";
      const startTime = "20260925T020000Z";
      const endTime = "20260925T050000Z";

      const icsLines = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//Wedding Invitation//EN",
        "BEGIN:VEVENT",
        "UID:" + Date.now() + "@wedding.invitation",
        "DTSTAMP:" + new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z",
        "DTSTART:" + startTime,
        "DTEND:" + endTime,
        "SUMMARY:" + title,
        "DESCRIPTION:" + description,
        "LOCATION:" + location,
        "END:VEVENT",
        "END:VCALENDAR"
      ];

      const icsBlob = new Blob([icsLines.join("\r\n")], { type: "text/calendar;charset=utf-8" });
      const downloadUrl = URL.createObjectURL(icsBlob);
      
      const anchor = document.createElement("a");
      anchor.href = downloadUrl;
      anchor.setAttribute("download", "wedding-invitation.ics");
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(downloadUrl);
    }

    const video = document.getElementById('envelope-video');
    const playBtn = document.getElementById('playBtn');

    // عند النقر على زر PRESS، يتم إخفاؤه وتشغيل الفيديو بسلاسة
    playBtn.addEventListener('click', () => {
      playBtn.style.opacity = '0';
      setTimeout(() => playBtn.style.display = 'none', 400);

      video.play().catch(error => {
        console.log("خطأ في التشغيل:", error);
        playBtn.style.display = 'block';
        playBtn.style.opacity = '1';
      });
    });

    // فور انتهاء الفيديو، ينتقل تلقائياً لصفحة الأسماء بتأثيراتها
    video.addEventListener('ended', () => {
      const envelope = document.getElementById('envelope-wrapper');
      const background = document.getElementById('main-background');
      const finalContainer = document.getElementById('final-container');

      envelope.classList.remove('active');
      background.classList.add('active');

      // ظهور الاسم الأول
      document.getElementById('n1').classList.add('show');

      // بعد ثانيتين، يظهر "and"
      setTimeout(() => {
        document.getElementById('n2').classList.add('show');
      }, 2000);

      // بعد ثانيتين أخريين، يظهر الاسم الثاني
      setTimeout(() => {
        document.getElementById('n3').classList.add('show');
      }, 4000);

      // الانتقال للشاشة الأخيرة
      setTimeout(() => {
        background.classList.remove('active');
        finalContainer.classList.add('active');
      }, 7700);
    });
  </script>

</body>
</html>
