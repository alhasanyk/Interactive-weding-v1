<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشغيل الفيديو والصوت</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        /* تصميم الزر الشفاف بكلمة press في منتصف الشاشة */
        #playBtn {
            position: absolute;
            top: 55%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 9999;
            background: transparent;
            border: 2px solid rgba(255, 255, 255, 0.7);
            color: white;
            font-size: 22px;
            font-family: Tahoma, sans-serif;
            letter-spacing: 3px;
            text-transform: uppercase;
            padding: 15px 40px;
            border-radius: 40px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
        }
        #playBtn:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        #playBtn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
    </style>
</head>
<body>

    <!-- الزر الشفاف بكلمة press -->
    <button id="playBtn">press</button>

    <!-- الفيديو مع وضع الصورة IMG_0048.jpeg كخلفية أولية -->
    <video id="myVideo" src="2026-09-21 17:15:00.mp4" poster="IMG_0048.jpeg" playsinline webkit-playsinline preload="auto"></video>
    <audio id="myAudio" src="myAudio.mp3" preload="auto"></audio>

    <script>
        const video = document.getElementById('myVideo');
        const audio = document.getElementById('myAudio');
        const playBtn = document.getElementById('playBtn');

        playBtn.addEventListener('click', () => {
            // إخفاء الزر بسلاسة عند النقر
            playBtn.style.opacity = '0';
            setTimeout(() => playBtn.style.display = 'none', 300);

            // تشغيل الفيديو
            video.play().catch(error => {
                console.log("خطأ في التشغيل:", error);
                playBtn.style.display = 'block';
                playBtn.style.opacity = '1';
            });
        });

        // تشغيل الصوت بعد انتهاء الفيديو تماماً
        video.addEventListener('ended', () => {
            audio.play().catch(error => {
                console.log("خطأ في تشغيل الصوت:", error);
            });
        });
    </script>

</body>
</html>
