<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تشغيل الفيديو والصوت</title>
    <!-- استيراد خط أنيق وراقي يشبه خطوط الدعوات وأسماء العرسان -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* إخفاء الفيديو في البداية وإظهار الصورة لتجنب أي وميض أسود */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: url('IMG_0048.jpeg') no-repeat center center;
            background-size: contain;
        }
        /* تصميم زر الختم الشمعي الدائري المخصص */
        #playBtn {
            position: absolute;
            top: 48%; /* رفعه قليلاً للأعلى */
            left: 53%; /* إزاحته جهة اليمين قليلاً */
            transform: translate(-50%, -50%);
            z-index: 9999;
            width: 90px;  /* حجم دائري أصغر ومناسب */
            height: 90px;
            background: rgba(235, 225, 210, 0.15); /* إيحاء بلون الختم الشمعي الفاتح والشفاف */
            backdrop-filter: blur(5px);
            border: 2px solid rgba(245, 235, 220, 0.8); /* إطار أنيق بلون الختم */
            color: #fcf8f2;
            font-size: 26px; /* حجم الخط المتناسق مع الدائرة */
            font-family: 'Great Vibes', cursive; /* خط أنيق يشبه خطوط أسماء العرسان */
            letter-spacing: 1px;
            border-radius: 50%; /* جعل الزر دائرياً تماماً كشكل الختم */
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            transition: 0.3s;
        }
        #playBtn:hover {
            background: rgba(235, 225, 210, 0.3);
            transform: translate(-50%, -50%) scale(1.05);
        }
        #playBtn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
    </style>
</head>
<body>

    <!-- زر الختم الدائري بكلمة press بالخط الأنيق -->
    <button id="playBtn">press</button>

    <!-- الفيديو والصوت -->
    <video id="myVideo" src="2026-09-21 17:15:00.mp4" playsinline webkit-playsinline preload="auto"></video>
    <audio id="myAudio" src="myAudio.mp3" preload="auto"></audio>

    <script>
        const video = document.getElementById('myVideo');
        const audio = document.getElementById('myAudio');
        const playBtn = document.getElementById('playBtn');

        playBtn.addEventListener('click', () => {
            // إخفاء الزر بسلاسة عند النقر
            playBtn.style.opacity = '0';
            setTimeout(() => playBtn.style.display = 'none', 300);

            // تشغيل الفيديو فوراً وبسلاسة تامة
            video.play().catch(error => {
                console.log("خطأ في التشغيل:", error);
                playBtn.style.display = 'flex';
                playBtn.style.opacity = '1';
            });
        });

        // تشغيل الصوت بعد انتهاء الفيديو تماماً
        video.addEventListener('ended', () => {
            audio.play().catch(error => {
                console.log("خطأ في تشغيل الصوت:", error);
            });
        });
    </script>

</body>
</html>
