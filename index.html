<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زواج</title>
    <!-- استيراد الخط الأنيق لأسماء العرسان وكلمة press -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* إظهار صورة الختم كخلفية ثابتة في البداية لتجنب أي شاشة سوداء */
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: url('IMG_0048.jpeg') no-repeat center center;
            background-size: contain;
        }
        /* تصميم زر الختم الدائري الشفاف والمضبوط بدقة فوق الختم */
        #playBtn {
            position: absolute;
            top: 53.5%; 
            left: 50.2%; 
            transform: translate(-50%, -50%);
            z-index: 9999;
            width: 105px;  
            height: 105px;
            background: transparent; /* خلفية شفافة تماماً للختم */
            border: 2px solid rgba(245, 235, 220, 0.75); /* إطار دائري بلون الختم */
            color: #fcf8f2;
            font-size: 32px; 
            font-family: 'Great Vibes', cursive; /* الخط الأنيق */
            letter-spacing: 1px;
            border-radius: 50%; /* دائري تماماً */
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: 0.3s;
        }
        #playBtn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        #playBtn:active {
            transform: translate(-50%, -50%) scale(0.95);
        }
    </style>
</head>
<body>

    <!-- زر الختم الدائري الشفاف -->
    <button id="playBtn">press</button>

    <!-- الفيديو والصوت بالاسم العربي مع الترميز الآمن للمتصفحات -->
    <video id="myVideo" src="2026-09-21 17:15:00.mov" playsinline webkit-playsinline preload="auto"></video>
    <audio id="myAudio" src="%D9%86%D8%B4%D9%8A%D8%AF%20%D8%B2%D9%88%D8%A7%D8%AC.mp3" preload="auto"></audio>

    <script>
        const video = document.getElementById('myVideo');
        const audio = document.getElementById('myAudio');
        const playBtn = document.getElementById('playBtn');

        playBtn.addEventListener('click', () => {
            // إخفاء الزر بسلاسة عند النقر
            playBtn.style.opacity = '0';
            setTimeout(() => playBtn.style.display = 'none', 300);

            // قص أول 5 ثواني من الفيديو
            video.currentTime = 5;

            // ضبط صوت الفيديو على الحد الأقصى (100%) ليكون واضحاً وقوياً
            video.volume = 1.0;

            // تشغيل الفيديو فوراً عند الضغط
            video.play().catch(error => {
                console.log("خطأ في تشغيل الفيديو:", error);
                playBtn.style.display = 'flex';
                playBtn.style.opacity = '1';
            });
        });

        // تشغيل النشيد تلقائياً بعد انتهاء الفيديو بتدرج بطيء جداً وصوت منخفض جداً كخلفية (Fade-in خافت)
        video.addEventListener('ended', () => {
            audio.volume = 0.0; // البدء من الصفر تماماً
            audio.play().then(() => {
                // تدرج بطيء جداً، والحد الأقصى للصوت منخفض جداً (5% فقط ليكون كأنه همس في الخلفية)
                let fadeAudio = setInterval(() => {
                    if (audio.volume < 0.05) {
                        audio.volume = Math.min(audio.volume + 0.005, 0.05);
                    } else {
                        clearInterval(fadeAudio);
                    }
                }, 500); // زيادة بطيئة جداً كل نصف ثانية لنعومة فائقة
            }).catch(error => {
                console.log("خطأ في تشغيل الصوت:", error);
            });
        });
    </script>

</body>
</html>
